<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen3-TTS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; padding: 24px; }
  h1 { font-size: 1.4rem; font-weight: 600; color: #a8c7fa; margin-bottom: 24px; }
  .card { background: #16213e; border: 1px solid #2a2a4a; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: #7a8cb8; margin-bottom: 14px; }
  label { display: block; font-size: 0.9rem; color: #b0b8d0; margin-bottom: 6px; }
  textarea, select {
    width: 100%;
    background: #0f1b35;
    border: 1px solid #2a3a5a;
    border-radius: 8px;
    color: #e0e0e0;
    font-size: 0.9rem;
    padding: 10px;
    outline: none;
  }
  textarea { height: 140px; resize: vertical; }
  textarea:focus, select:focus { border-color: #4a7cdc; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px; border-radius: 8px; font-size: 0.95rem; font-weight: 500; cursor: pointer; border: none; transition: background 0.2s; }
  .btn-primary { background: #4a7cdc; color: #fff; }
  .btn-primary:hover { background: #5a8cec; }
  .btn-primary:disabled { background: #2a4a7c; color: #6a7a9a; cursor: default; }
  .btn-ghost { background: #1e2d4a; color: #a0b0d0; border: 1px solid #2a3a5a; }
  .btn-ghost:hover { background: #253555; }
  .file-zone { border: 2px dashed #2a3a5a; border-radius: 8px; padding: 18px; text-align: center; cursor: pointer; transition: border-color 0.2s; }
  .file-zone:hover, .file-zone.drag { border-color: #4a7cdc; }
  .file-zone input { display: none; }
  .file-zone p { color: #6a7a9a; font-size: 0.9rem; }
  .file-zone .filename { color: #a8c7fa; font-size: 0.85rem; margin-top: 6px; }
  .voices-grid { display: flex; flex-direction: column; gap: 10px; }
  .voice-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; }
  .voice-item:hover { background: #1e2d4a; }
  .voice-item.selected { border-color: #4a7cdc; background: #1a2a45; }
  .voice-name { font-size: 0.95rem; flex: 1; text-transform: capitalize; }
  .mini-player button { background: #253555; border: none; color: #a0b0d0; border-radius: 6px; width: 32px; height: 32px; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
  .mini-player button:hover { background: #2e4060; }
  .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .slider-block label { margin-bottom: 10px; }
  .slider-row { display: flex; align-items: center; gap: 14px; }
  input[type=range] { flex: 1; accent-color: #4a7cdc; }
  .slider-val { min-width: 42px; text-align: right; font-size: 0.9rem; color: #a8c7fa; font-weight: 600; }
  .progress-bar { height: 6px; background: #1e2d4a; border-radius: 4px; overflow: hidden; margin-top: 10px; }
  .progress-fill { height: 100%; background: #4a7cdc; border-radius: 4px; transition: width 0.4s; width: 0%; }
  .progress-text { font-size: 0.85rem; color: #7a8cb8; margin-top: 6px; }
  audio { width: 100%; margin-top: 8px; }
  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .history-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #0f1b35; border-radius: 8px; font-size: 0.85rem; }
  .history-item .hname { flex: 1; color: #a0b0d0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-item .hdur { color: #6a7a9a; min-width: 56px; text-align: right; }
  .status-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .badge-running { background: #1a3a6a; color: #6a9cec; }
  .badge-done { background: #0a3a1a; color: #4adc7a; }
  .badge-error { background: #3a1a1a; color: #dc4a4a; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: #253555; border: 1px solid #2a3a5a; border-radius: 10px; padding: 12px 18px; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; max-width: 320px; }
  .toast.show { opacity: 1; }
  .empty { color: #4a5a7a; font-size: 0.85rem; font-style: italic; }
</style>
</head>
<body>

<h1>Qwen3-TTS</h1>

<div class="card">
  <h2>Текст</h2>
  <div class="file-zone" id="fileZone" onclick="document.getElementById('fileInput').click()">
    <input type="file" id="fileInput" accept=".txt">
    <p>Нажмите или перетащите .txt файл</p>
    <div class="filename" id="fileName"></div>
  </div>
  <div style="margin-top:14px">
    <label>Превью текста</label>
    <textarea id="textPreview" placeholder="Или введите текст прямо здесь..."></textarea>
  </div>
</div>

<div class="card">
  <h2>Голос</h2>
  <div class="voices-grid" id="voicesGrid">
    <p class="empty">Загрузка голосов...</p>
  </div>
</div>

<div class="card">
  <h2>Параметры</h2>
  <div class="controls-grid">
    <div>
      <label for="languageSelect">Язык</label>
      <select id="languageSelect">
        <option value="Auto">Auto</option>
        <option value="Russian" selected>Russian</option>
        <option value="English">English</option>
        <option value="Chinese">Chinese</option>
      </select>
    </div>
    <div class="slider-block">
      <label for="temperatureSlider">Выразительность</label>
      <div class="slider-row">
        <input type="range" id="temperatureSlider" min="0.5" max="1.0" step="0.05" value="0.9">
        <span class="slider-val" id="temperatureVal">0.90</span>
      </div>
    </div>
    <div class="slider-block">
      <label for="repetitionSlider">Чистота звука</label>
      <div class="slider-row">
        <input type="range" id="repetitionSlider" min="1.0" max="1.3" step="0.05" value="1.05">
        <span class="slider-val" id="repetitionVal">1.05</span>
      </div>
    </div>
    <div class="slider-block">
      <label for="subtalkerSlider">Стабильность</label>
      <div class="slider-row">
        <input type="range" id="subtalkerSlider" min="0.5" max="1.0" step="0.05" value="0.9">
        <span class="slider-val" id="subtalkerVal">0.90</span>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <h2>Синтез</h2>
  <button class="btn btn-primary" id="generateBtn" onclick="startGenerate()">
    &#9654; Запустить синтез
  </button>
  <div id="progressBlock" style="display:none; margin-top:14px">
    <span class="status-badge badge-running" id="statusBadge">В процессе</span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">Инициализация...</div>
  </div>
  <div id="resultBlock" style="display:none; margin-top:16px">
    <label>Результат</label>
    <audio id="resultAudio" controls></audio>
    <div style="margin-top:10px">
      <button class="btn btn-ghost" onclick="downloadResult()">&#11015; Скачать</button>
    </div>
  </div>
</div>

<div class="card">
  <h2>История</h2>
  <div class="history-list" id="historyList">
    <p class="empty">Ещё ничего не сгенерировано</p>
  </div>
</div>

<div class="toast" id="toast"></div>
<audio id="sampleAudio" style="display:none"></audio>

<script>
let selectedVoice = null;
let currentJobId = null;
let pollTimer = null;

const fileInput = document.getElementById('fileInput');
const fileZone = document.getElementById('fileZone');

fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (!f) return;
  document.getElementById('fileName').textContent = f.name;
  const reader = new FileReader();
  reader.onload = e => document.getElementById('textPreview').value = e.target.result;
  reader.readAsText(f, 'utf-8');
});

fileZone.addEventListener('dragover', e => { e.preventDefault(); fileZone.classList.add('drag'); });
fileZone.addEventListener('dragleave', () => fileZone.classList.remove('drag'));
fileZone.addEventListener('drop', e => {
  e.preventDefault();
  fileZone.classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (!f || !f.name.endsWith('.txt')) { showToast('Только .txt файлы'); return; }
  document.getElementById('fileName').textContent = f.name;
  const reader = new FileReader();
  reader.onload = ev => document.getElementById('textPreview').value = ev.target.result;
  reader.readAsText(f, 'utf-8');
});

async function loadVoices() {
  const grid = document.getElementById('voicesGrid');
  try {
    const voices = await fetch('/voices').then(r => r.json());
    if (!voices.length) {
      grid.innerHTML = '<p class="empty">Папка voices/ пуста</p>';
      return;
    }
    grid.innerHTML = '';
    voices.forEach(v => {
      const item = document.createElement('div');
      item.className = 'voice-item';
      item.dataset.name = v.name;
      item.innerHTML = `
        <span class="voice-name">${v.name}</span>
        <div class="mini-player">
          <button title="Прослушать" onclick="playSample('${v.name}', this)">&#9654;</button>
        </div>`;
      item.addEventListener('click', e => {
        if (e.target.tagName === 'BUTTON') return;
        selectVoice(v.name);
      });
      grid.appendChild(item);
    });
    selectVoice(voices[0].name);
  } catch (e) {
    grid.innerHTML = '<p class="empty">Не удалось загрузить голоса</p>';
  }
}

function selectVoice(name) {
  selectedVoice = name;
  document.querySelectorAll('.voice-item').forEach(el => {
    el.classList.toggle('selected', el.dataset.name === name);
  });
}

const sampleAudio = document.getElementById('sampleAudio');
let currentSampleBtn = null;

function playSample(name, btn) {
  if (currentSampleBtn && currentSampleBtn !== btn) currentSampleBtn.innerHTML = '&#9654;';
  if (!sampleAudio.paused && currentSampleBtn === btn) {
    sampleAudio.pause();
    btn.innerHTML = '&#9654;';
    currentSampleBtn = null;
    return;
  }
  sampleAudio.src = '/sample/' + name;
  sampleAudio.play();
  btn.innerHTML = '&#9646;&#9646;';
  currentSampleBtn = btn;
  sampleAudio.onended = () => {
    btn.innerHTML = '&#9654;';
    currentSampleBtn = null;
  };
}

function bindSlider(id, outputId) {
  const slider = document.getElementById(id);
  const output = document.getElementById(outputId);
  slider.addEventListener('input', () => output.textContent = (+slider.value).toFixed(2));
}

bindSlider('temperatureSlider', 'temperatureVal');
bindSlider('repetitionSlider', 'repetitionVal');
bindSlider('subtalkerSlider', 'subtalkerVal');

async function startGenerate() {
  const text = document.getElementById('textPreview').value.trim();
  if (!text) { showToast('Введите или загрузите текст'); return; }
  if (!selectedVoice) { showToast('Выберите голос'); return; }

  const languageRaw = document.getElementById('languageSelect').value;
  const language = languageRaw === 'Auto' ? 'Russian' : languageRaw;

  const btn = document.getElementById('generateBtn');
  btn.disabled = true;
  document.getElementById('resultBlock').style.display = 'none';
  document.getElementById('progressBlock').style.display = 'block';
  setStatus('running', 'Запуск...');
  setProgress(0);

  try {
    const res = await fetch('/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        text,
        voice: selectedVoice,
        language,
        temperature: +document.getElementById('temperatureSlider').value,
        repetition_penalty: +document.getElementById('repetitionSlider').value,
        subtalker_temperature: +document.getElementById('subtalkerSlider').value
      })
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || 'Ошибка запуска');
    }
    const { job_id } = await res.json();
    currentJobId = job_id;
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(() => pollStatus(job_id), 1500);
  } catch (e) {
    setStatus('error', e.message || 'Ошибка');
    btn.disabled = false;
  }
}

async function pollStatus(jobId) {
  try {
    const res = await fetch('/status/' + jobId);
    if (!res.ok) return;
    const job = await res.json();
    if (job.status === 'running') {
      setStatus('running', job.progress || 'Синтез...');
      setProgress(job.progress_pct || 0);
      return;
    }
    clearInterval(pollTimer);
    if (job.status === 'done') {
      setStatus('done', 'Готово');
      setProgress(100);
      document.getElementById('resultAudio').src = '/download/' + jobId;
      document.getElementById('resultBlock').style.display = 'block';
      loadHistory();
    } else {
      setStatus('error', job.error || 'Ошибка синтеза');
    }
    document.getElementById('generateBtn').disabled = false;
  } catch (e) {}
}

function setStatus(type, text) {
  const badge = document.getElementById('statusBadge');
  badge.className = 'status-badge badge-' + type;
  badge.textContent = type === 'running' ? 'В процессе' : type === 'done' ? 'Готово' : 'Ошибка';
  document.getElementById('progressText').textContent = text;
}

function setProgress(pct) {
  document.getElementById('progressFill').style.width = pct + '%';
}

function downloadResult() {
  if (!currentJobId) return;
  const a = document.createElement('a');
  a.href = '/download/' + currentJobId;
  a.download = '';
  a.click();
}

async function loadHistory() {
  const list = document.getElementById('historyList');
  try {
    const history = await fetch('/history').then(r => r.json());
    if (!history.length) {
      list.innerHTML = '<p class="empty">Ещё ничего не сгенерировано</p>';
      return;
    }
    list.innerHTML = history.map(h => `
      <div class="history-item">
        <span class="hname" title="${h.file}">${h.voice} - ${h.file}</span>
        <span class="hdur">${h.duration_sec}с</span>
        <button class="btn btn-ghost" style="padding:5px 12px;font-size:0.8rem" onclick="playHistory('${h.id}')">&#9654;</button>
        <button class="btn btn-ghost" style="padding:5px 12px;font-size:0.8rem" onclick="dlHistory('${h.id}')">&#11015;</button>
      </div>`).join('');
  } catch (e) {}
}

function playHistory(id) {
  currentJobId = id;
  document.getElementById('resultAudio').src = '/download/' + id;
  document.getElementById('resultBlock').style.display = 'block';
  document.getElementById('resultAudio').play();
}

function dlHistory(id) {
  const a = document.createElement('a');
  a.href = '/download/' + id;
  a.download = '';
  a.click();
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

loadVoices();
loadHistory();
</script>
</body>
</html>
